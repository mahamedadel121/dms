# nginx reverse proxy for DMS (HTTPS). Example only, never run on the build machine.
# Drop this into the http {} block of nginx.conf, or into /etc/nginx/conf.d/dms.conf.
# Replace dms.example.com and the certificate paths. See docs/ARCHITECTURE.md.
#
# Ports on the same machine: web 3000, api 4000, bot webhook 4100 (only if BOT_MODE=webhook).

upstream dms_web { server 127.0.0.1:3000; keepalive 16; }
upstream dms_api { server 127.0.0.1:4000; keepalive 16; }
upstream dms_bot_webhook { server 127.0.0.1:4100; }

server {
    listen 80;
    server_name dms.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dms.example.com;

    ssl_certificate     /etc/letsencrypt/live/dms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dms.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Receipts are at most 15 MB (media.maxFileSizeMb); a little headroom for multipart overhead.
    client_max_body_size 20m;

    # Telegram webhook. The location MUST match the path in BOT_WEBHOOK_URL,
    # e.g. BOT_WEBHOOK_URL=https://dms.example.com/telegram/webhook.
    location /telegram/webhook {
        proxy_pass http://dms_bot_webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API (prefix /api/v1), including signed file downloads at /api/v1/files/.
    location /api/ {
        proxy_pass http://dms_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Web app (Next.js). Next.js also rewrites /api/v1 to the API, so /api/ above is optional.
    location / {
        proxy_pass http://dms_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
